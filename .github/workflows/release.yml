name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          tag = os.environ['RELEASE_TAG']
          assert os.environ['REF_TYPE'] == 'tag', 'Run Release against a version tag'
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Expected vX.Y.Z'
          assert tag == f'v{version}', 'Tag must match Cargo.toml'
          assert pathlib.Path(f'docs/releases/{tag}.md').is_file(), 'Missing release notes'
          PY
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Smoke test and package
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          "target/$TARGET/release/imap-notify" --version
          "target/$TARGET/release/imap-notify" -c config.example.toml --check
          package="imap-notify-$RELEASE_TAG-$TARGET"
          mkdir -p "dist/$package/deploy"
          cp "target/$TARGET/release/imap-notify" README.md LICENSE config.example.toml "dist/$package/"
          cp deploy/imap-notify.service "dist/$package/deploy/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "IMAP-Notify $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
