[package]
name = "imap-notify"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/JAX1024Dev/IMAP-Notify"
readme = "README.md"
description = "IMAP IDLE 新邮件实时监听，通过 Bark 推送通知"
license = "MIT"

[dependencies]
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["native-tls"] }
mail-parser = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = "3"

[profile.release]
lto = true
strip = true
